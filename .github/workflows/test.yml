name: Validate AI MVP

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate source data
        run: python scripts/validate_data.py

      - name: Validate committed deployment models
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from live_forecast import train_forecast_only_models

          models, history = train_forecast_only_models()
          assert sorted(models) == ["demand_mwh", "renewable_mwh"]
          assert len(history) == 25559
          print("Committed deployment models loaded successfully.")
          PY

      - name: Train and backtest models
        run: python scripts/train_models.py

      - name: Validate generated AI results
        run: python scripts/validate_ai.py

      - name: Run optimizer unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test Streamlit app
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat streamlit.log
          exit 1
